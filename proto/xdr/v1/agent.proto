syntax = "proto3";

package xdr.v1;

option go_package = "github.com/Bogan1011/xdr-agent/gen/xdr/v1;xdrv1";

// EnrollmentService runs on a TLS port without client certificates. An agent
// presents a one-time enrollment token and a CSR and receives a signed client
// certificate used for every later call.
service EnrollmentService {
  rpc Enroll(EnrollRequest) returns (EnrollResponse);
}

// AgentService requires mTLS. The agent identity is taken from the client
// certificate's common name, never from the request body.
service AgentService {
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
  // Unary per batch so every batch is acknowledged and can be retried.
  rpc SendEvents(EventBatch) returns (SendEventsResponse);
  // Detection content (YARA rules) the agent evaluates locally. Fetched when
  // the heartbeat reports a version different from the agent's.
  rpc GetDetectionContent(DetectionContentRequest) returns (DetectionContent);
  // Outcome of a response command delivered through the heartbeat.
  rpc ReportCommandResult(CommandResult) returns (CommandResultAck);
  // One chunk of the agent binary the console offers, for self-update. Unary
  // per chunk so the mTLS auth interceptor covers it and a failed chunk is
  // retried alone.
  rpc GetAgentBinary(AgentBinaryRequest) returns (AgentBinaryChunk);

  // Privileged access management.
  // A local user asks for just-in-time sudo; an admin decides in the console.
  rpc RequestElevation(ElevationRequest) returns (ElevationStatus);
  rpc GetElevation(GetElevationRequest) returns (ElevationStatus);
  // The host's privileged accounts, sent when they change and periodically.
  rpc ReportPrivilegedAccounts(PrivilegedAccounts) returns (PrivilegedAccountsAck);
  // One finished sudo session recorded by sudo's I/O logging.
  rpc UploadSessionRecording(SessionRecording) returns (SessionRecordingAck);
}

message HostInfo {
  string hostname = 1;
  string os = 2;
  string os_version = 3;
  string kernel = 4;
  string arch = 5;
  repeated string ip_addresses = 6;
  string agent_version = 7;
  string machine_id = 8;
}

message EnrollRequest {
  string enrollment_token = 1;
  bytes csr_pem = 2;
  HostInfo host = 3;
}

message EnrollResponse {
  string agent_id = 1;
  bytes certificate_pem = 2;
  bytes ca_pem = 3;
}

message HeartbeatRequest {
  HostInfo host = 1;
  AgentStats stats = 2;
  // True while the host's network is isolated by the agent.
  bool isolated = 3;
  string content_version = 4;
  // True while the agent's tamper protection is applied on the host.
  bool tamper_protected = 5;
}

message AgentStats {
  uint64 events_sent = 1;
  uint64 events_dropped = 2;
  uint64 uptime_seconds = 3;
  double cpu_percent = 4;
  uint64 rss_bytes = 5;
}

message HeartbeatResponse {
  int64 server_time_unix = 1;
  // Commands for the agent to run, delivered once.
  repeated AgentCommand commands = 2;
  // Version of the current detection content; empty when there is none.
  string content_version = 3;
  TamperPolicy tamper = 4;
  PamPolicy pam = 5;
}

message PamPolicy {
  // Record every sudo session on the host, not only just-in-time grants.
  bool record_all_sudo = 1;
}

message TamperPolicy {
  bool enabled = 1;
  // SHA-256 (hex) of the maintenance token that unlocks the agent locally.
  string maintenance_token_sha256 = 2;
}

enum CommandType {
  COMMAND_TYPE_UNSPECIFIED = 0;
  // Remove the agent, its config and its identity from the host.
  COMMAND_TYPE_UNINSTALL = 1;
  // args: pid, exe (optional, must match /proc/<pid>/exe).
  COMMAND_TYPE_KILL_PROCESS = 2;
  // args: path. The result message is the quarantine id.
  COMMAND_TYPE_QUARANTINE_FILE = 3;
  // args: quarantine_id.
  COMMAND_TYPE_RESTORE_FILE = 4;
  // args: allow (comma separated IPs or CIDRs reachable besides the console).
  COMMAND_TYPE_ISOLATE_HOST = 5;
  COMMAND_TYPE_UNISOLATE_HOST = 6;
  // args: path (file or directory) to scan with the YARA rules.
  COMMAND_TYPE_SCAN_PATH = 7;
  // args: version, sha256 (of the binary for the agent's architecture).
  COMMAND_TYPE_UPDATE_AGENT = 8;
  // args: request_id, user, duration_seconds. Grants sudo until it expires.
  COMMAND_TYPE_GRANT_ELEVATION = 9;
  // args: request_id, user. Removes the grant and ends the user's sudo sessions.
  COMMAND_TYPE_REVOKE_ELEVATION = 10;
}

message AgentCommand {
  string id = 1;
  CommandType type = 2;
  map<string, string> args = 3;
}

message CommandResult {
  string command_id = 1;
  bool success = 2;
  string message = 3;
}

message CommandResultAck {}

message DetectionContentRequest {}

message DetectionContent {
  string version = 1;
  // YARA source of every enabled rule, concatenated.
  string yara_rules = 2;
}

message AgentBinaryRequest {
  string arch = 1;
  uint64 offset = 2;
}

message AgentBinaryChunk {
  bytes data = 1;
  uint64 total_size = 2;
  string version = 3;
}

message EventBatch {
  repeated Event events = 1;
}

message SendEventsResponse {
  uint64 accepted = 1;
}

enum EventType {
  EVENT_TYPE_UNSPECIFIED = 0;
  EVENT_TYPE_PROCESS_EXEC = 1;
  EVENT_TYPE_PROCESS_EXIT = 2;
  EVENT_TYPE_FILE_CREATE = 3;
  EVENT_TYPE_FILE_MODIFY = 4;
  EVENT_TYPE_FILE_DELETE = 5;
  EVENT_TYPE_FILE_RENAME = 6;
  EVENT_TYPE_FILE_ATTRIB = 7;
  EVENT_TYPE_NET_CONNECT = 8;
  EVENT_TYPE_NET_LISTEN = 9;
  EVENT_TYPE_YARA_MATCH = 10;
  EVENT_TYPE_NET_ACCEPT = 11;
  EVENT_TYPE_AGENT_TAMPER = 12;
}

message Event {
  string id = 1;
  int64 timestamp_unix_nano = 2;
  EventType type = 3;
  oneof payload {
    ProcessEvent process = 10;
    FileEvent file = 11;
    NetworkEvent network = 12;
    YaraMatch yara = 13;
    TamperEvent tamper = 14;
  }
}

message ProcessEvent {
  uint32 pid = 1;
  uint32 ppid = 2;
  uint32 uid = 3;
  uint32 gid = 4;
  string user = 5;
  string exe = 6;
  repeated string args = 7;
  string cwd = 8;
  string sha256 = 9;
  string parent_exe = 10;
  int32 exit_code = 11;
}

message FileEvent {
  string path = 1;
  string old_path = 2;
  uint64 size = 3;
  uint32 mode = 4;
  uint32 uid = 5;
  string sha256 = 6;
  // The process that made the change. Only the eBPF collector knows it;
  // inotify events leave these empty.
  uint32 pid = 7;
  uint32 ppid = 8;
  string exe = 9;
  string user = 10;
}

message NetworkEvent {
  string protocol = 1;
  string local_addr = 2;
  uint32 local_port = 3;
  string remote_addr = 4;
  uint32 remote_port = 5;
  uint32 pid = 6;
  string exe = 7;
  uint32 uid = 8;
}

message YaraMatch {
  string path = 1;
  string sha256 = 2;
  repeated string rules = 3;
  // The process whose binary matched, when the scan came from an exec.
  uint32 pid = 4;
  uint64 size = 5;
}

// Something tried to stop, change or remove the agent, or protection changed.
message TamperEvent {
  // e.g. signal_ignored, unclean_restart, protection_removed, maintenance.
  string action = 1;
  string detail = 2;
  uint32 pid = 3;
  string exe = 4;
}

message ElevationRequest {
  // The local account, identified by the agent from the socket peer.
  string user = 1;
  uint32 uid = 2;
  string reason = 3;
  uint64 duration_seconds = 4;
}

message GetElevationRequest {
  string id = 1;
}

message ElevationStatus {
  string id = 1;
  // pending, approved, active, denied, expired, revoked or failed.
  string status = 2;
  string note = 3;
  int64 expires_unix = 4;
}

message PrivilegedAccount {
  string name = 1;
  uint32 uid = 2;
  string shell = 3;
  string home = 4;
  // Why the account is privileged, e.g. uid0, group:sudo, sudoers, jit.
  repeated string sources = 5;
  repeated string groups = 6;
  // A sudoers rule lets it run commands without a password.
  bool nopasswd = 7;
  // set, locked, empty or none.
  string password = 8;
  int64 password_changed_unix = 9;
  uint32 ssh_keys = 10;
  int64 last_login_unix = 11;
  string last_login_from = 12;
}

message PrivilegedAccounts {
  repeated PrivilegedAccount accounts = 1;
  // Accounts in /etc/passwd with a login shell.
  uint32 interactive_accounts = 2;
}

message PrivilegedAccountsAck {}

message SessionRecording {
  // Unique per host: the sudo I/O log directory.
  string session_id = 1;
  string user = 2;
  string runas_user = 3;
  string tty = 4;
  string cwd = 5;
  string command = 6;
  int64 start_unix = 7;
  uint64 duration_ms = 8;
  // Terminal output (ttyout or stdout), capped by the agent.
  bytes output = 9;
  bool truncated = 10;
  // The just-in-time grant active when the session ran, if any.
  string request_id = 11;
}

message SessionRecordingAck {}
