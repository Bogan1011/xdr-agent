syntax = "proto3";

package xdr.v1;

option go_package = "github.com/Bogan1011/xdr-agent/gen/xdr/v1;xdrv1";

// EnrollmentService runs on a TLS port without client certificates. An agent
// presents a one-time enrollment token and a CSR and receives a signed client
// certificate used for every later call.
service EnrollmentService {
  rpc Enroll(EnrollRequest) returns (EnrollResponse);
}

// AgentService requires mTLS. The agent identity is taken from the client
// certificate's common name, never from the request body.
service AgentService {
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
  // Unary per batch so every batch is acknowledged and can be retried.
  rpc SendEvents(EventBatch) returns (SendEventsResponse);
  // Detection content (YARA rules) the agent evaluates locally. Fetched when
  // the heartbeat reports a version different from the agent's.
  rpc GetDetectionContent(DetectionContentRequest) returns (DetectionContent);
  // Outcome of a response command delivered through the heartbeat.
  rpc ReportCommandResult(CommandResult) returns (CommandResultAck);
  // One chunk of the agent binary the console offers, for self-update. Unary
  // per chunk so the mTLS auth interceptor covers it and a failed chunk is
  // retried alone.
  rpc GetAgentBinary(AgentBinaryRequest) returns (AgentBinaryChunk);

  // Privileged access management.
  // A local user asks for just-in-time sudo; an admin decides in the console.
  rpc RequestElevation(ElevationRequest) returns (ElevationStatus);
  rpc GetElevation(GetElevationRequest) returns (ElevationStatus);
  // The host's privileged accounts, sent when they change and periodically.
  rpc ReportPrivilegedAccounts(PrivilegedAccounts) returns (PrivilegedAccountsAck);
  // One finished sudo session recorded by sudo's I/O logging.
  rpc UploadSessionRecording(SessionRecording) returns (SessionRecordingAck);

  // A long-lived stream the agent keeps open so the console reaches it at
  // once: remote shells and the live activity view. The agent dials out, so
  // the host needs no inbound port.
  rpc Live(stream LiveUp) returns (stream LiveDown);
}

message HostInfo {
  string hostname = 1;
  string os = 2;
  string os_version = 3;
  string kernel = 4;
  string arch = 5;
  repeated string ip_addresses = 6;
  string agent_version = 7;
  string machine_id = 8;
}

message EnrollRequest {
  string enrollment_token = 1;
  bytes csr_pem = 2;
  HostInfo host = 3;
}

message EnrollResponse {
  string agent_id = 1;
  bytes certificate_pem = 2;
  bytes ca_pem = 3;
}

message HeartbeatRequest {
  HostInfo host = 1;
  AgentStats stats = 2;
  // True while the host's network is isolated by the agent.
  bool isolated = 3;
  string content_version = 4;
  // True while the agent's tamper protection is applied on the host.
  bool tamper_protected = 5;
  PreventionState prevention = 6;
}

message AgentStats {
  uint64 events_sent = 1;
  uint64 events_dropped = 2;
  uint64 uptime_seconds = 3;
  double cpu_percent = 4;
  uint64 rss_bytes = 5;
}

message HeartbeatResponse {
  int64 server_time_unix = 1;
  // Commands for the agent to run, delivered once.
  repeated AgentCommand commands = 2;
  // Version of the current detection content; empty when there is none.
  string content_version = 3;
  TamperPolicy tamper = 4;
  PamPolicy pam = 5;
  PreventionPolicy prevention = 6;
}

// PreventionPolicy is what the agent enforces on the host, as opposed to
// what it only reports.
//
// The console edits it as a named policy with one module per section; each
// endpoint is assigned one policy.
message PreventionPolicy {
  // Deprecated: anti_malware.block_known_bad. Read only to migrate policies
  // saved before modules existed.
  bool block_exec = 1;
  FimPolicy fim = 2;
  FirewallPolicy firewall = 3;
  AntiMalwarePolicy anti_malware = 4;
  WebReputationPolicy web_reputation = 5;
  IntrusionPreventionPolicy intrusion_prevention = 6;
  DeviceControlPolicy device_control = 7;
  ActivityMonitoringPolicy activity_monitoring = 8;
  ApplicationControlPolicy application_control = 9;
  // The console's name for the policy, shown in the agent's log.
  string name = 10;
  // Bumped on every change to the policy in the console.
  int64 version = 11;
}

message AntiMalwarePolicy {
  // Real-time YARA scanning of new and changed files and executed binaries.
  bool enabled = 1;
  // Deny execution of files whose SHA-256 is a hash IOC (fanotify).
  bool block_known_bad = 2;
  // Move files that match a YARA rule into quarantine.
  bool auto_quarantine = 3;
}

// Outbound connections to known-bad addresses: IP and domain IOCs from threat
// intel and the policy's own domains, resolved by the agent.
message WebReputationPolicy {
  bool enabled = 1;
  // Reject the connections; otherwise only report them.
  bool block = 2;
  bool use_threat_intel = 3;
  repeated string blocked_domains = 4;
  // Never blocked, even when threat intel lists them.
  repeated string allowed_domains = 5;
}

// Brute-force protection: repeated failed SSH logins from one address.
message IntrusionPreventionPolicy {
  bool enabled = 1;
  // Ban the address with nftables; otherwise only report it.
  bool prevent = 2;
  uint32 max_failures = 3;
  uint32 window_seconds = 4;
  uint32 ban_minutes = 5;
  // IPs or CIDRs that are never banned.
  repeated string allow = 6;
}

message DeviceControlPolicy {
  bool enabled = 1;
  // USB mass storage: allow or block.
  string usb_storage = 2;
  // vendor:product IDs (hex, e.g. "0781:5583") that are always allowed.
  repeated string allowed_devices = 3;
}

// Which telemetry the agent sends. Prevention and detection events are
// always sent.
message ActivityMonitoringPolicy {
  bool process = 1;
  bool file = 2;
  bool network = 3;
}

message ApplicationControlPolicy {
  bool enabled = 1;
  // Deny execution of matching files; otherwise only report it.
  bool block = 2;
  // Path prefixes, or globs when they contain * ? or [.
  repeated string blocked_paths = 3;
  repeated string blocked_sha256 = 4;
  // Lockdown: only files under allowed_paths or with an allowed hash may run.
  // The block lists still win over the allow-list.
  bool lockdown = 5;
  repeated string allowed_paths = 6;
  repeated string allowed_sha256 = 7;
  // Stop shells and script interpreters (bash, python, perl...) from running
  // script files that sit under script_paths, e.g. /tmp.
  bool block_scripts = 8;
  repeated string script_paths = 9;
}

// File integrity monitoring: a baseline of hashes, owners and modes for the
// paths, compared on file events and on a full rescan every interval.
message FimPolicy {
  bool enabled = 1;
  // Files or directories (recursive).
  repeated string paths = 2;
  // Path prefixes, or glob patterns when they contain * ? or [.
  repeated string exclude = 3;
  uint32 interval_minutes = 4;
}

// Host firewall applied with nftables. Loopback, established connections and
// the console are always allowed.
message FirewallPolicy {
  bool enabled = 1;
  // Drop new inbound connections that no rule allows.
  bool default_deny_inbound = 2;
  repeated FirewallRule rules = 3;
}

message FirewallRule {
  // in or out.
  string direction = 1;
  // allow or deny.
  string action = 2;
  // tcp, udp, icmp or any.
  string protocol = 3;
  // Comma separated ports or ranges, e.g. "22" or "80,443,8000-8100".
  string ports = 4;
  // Remote IP or CIDR; empty matches any address.
  string cidr = 5;
  string comment = 6;
}

// What the agent is enforcing right now.
message PreventionState {
  bool exec_blocking = 1;
  uint32 blocked_hashes = 2;
  bool fim_active = 3;
  uint32 fim_files = 4;
  bool firewall_applied = 5;
  // Why part of the policy could not be applied, if it could not.
  string error = 6;
  string policy_name = 7;
  bool realtime_scan = 8;
  // Addresses on the web reputation block list.
  uint32 web_reputation_addrs = 9;
  bool web_reputation_blocking = 10;
  bool intrusion_prevention = 11;
  uint32 banned_addrs = 12;
  bool device_control = 13;
  uint32 blocked_devices = 14;
  bool app_control = 15;
  bool script_blocking = 16;
}

message PamPolicy {
  // Record every sudo session on the host, not only just-in-time grants.
  bool record_all_sudo = 1;
}

message TamperPolicy {
  bool enabled = 1;
  // SHA-256 (hex) of the maintenance token that unlocks the agent locally.
  string maintenance_token_sha256 = 2;
}

enum CommandType {
  COMMAND_TYPE_UNSPECIFIED = 0;
  // Remove the agent, its config and its identity from the host.
  COMMAND_TYPE_UNINSTALL = 1;
  // args: pid, exe (optional, must match /proc/<pid>/exe).
  COMMAND_TYPE_KILL_PROCESS = 2;
  // args: path. The result message is the quarantine id.
  COMMAND_TYPE_QUARANTINE_FILE = 3;
  // args: quarantine_id.
  COMMAND_TYPE_RESTORE_FILE = 4;
  // args: allow (comma separated IPs or CIDRs reachable besides the console).
  COMMAND_TYPE_ISOLATE_HOST = 5;
  COMMAND_TYPE_UNISOLATE_HOST = 6;
  // args: path (file or directory) to scan with the YARA rules.
  COMMAND_TYPE_SCAN_PATH = 7;
  // args: version, sha256 (of the binary for the agent's architecture).
  COMMAND_TYPE_UPDATE_AGENT = 8;
  // args: request_id, user, duration_seconds. Grants sudo until it expires.
  COMMAND_TYPE_GRANT_ELEVATION = 9;
  // args: request_id, user. Removes the grant and ends the user's sudo sessions.
  COMMAND_TYPE_REVOKE_ELEVATION = 10;
  // Accept the current state of the monitored files as the new FIM baseline.
  COMMAND_TYPE_FIM_REBASELINE = 11;
}

message AgentCommand {
  string id = 1;
  CommandType type = 2;
  map<string, string> args = 3;
}

message CommandResult {
  string command_id = 1;
  bool success = 2;
  string message = 3;
}

message CommandResultAck {}

message DetectionContentRequest {}

message DetectionContent {
  string version = 1;
  // YARA source of every enabled rule, concatenated.
  string yara_rules = 2;
  // SHA-256 hash IOCs as concatenated 32-byte digests, for exec blocking.
  bytes blocked_sha256 = 3;
  // IP (or CIDR) and domain IOCs, for web reputation.
  repeated string bad_ips = 4;
  repeated string bad_domains = 5;
}

message AgentBinaryRequest {
  string arch = 1;
  uint64 offset = 2;
}

message AgentBinaryChunk {
  bytes data = 1;
  uint64 total_size = 2;
  string version = 3;
}

message EventBatch {
  repeated Event events = 1;
}

message SendEventsResponse {
  uint64 accepted = 1;
}

enum EventType {
  EVENT_TYPE_UNSPECIFIED = 0;
  EVENT_TYPE_PROCESS_EXEC = 1;
  EVENT_TYPE_PROCESS_EXIT = 2;
  EVENT_TYPE_FILE_CREATE = 3;
  EVENT_TYPE_FILE_MODIFY = 4;
  EVENT_TYPE_FILE_DELETE = 5;
  EVENT_TYPE_FILE_RENAME = 6;
  EVENT_TYPE_FILE_ATTRIB = 7;
  EVENT_TYPE_NET_CONNECT = 8;
  EVENT_TYPE_NET_LISTEN = 9;
  EVENT_TYPE_YARA_MATCH = 10;
  EVENT_TYPE_NET_ACCEPT = 11;
  EVENT_TYPE_AGENT_TAMPER = 12;
  // An exec was denied by the prevention policy (process payload: pid and
  // parent_exe are the caller, exe and sha256 the blocked file).
  EVENT_TYPE_EXEC_BLOCKED = 13;
  // A monitored file differs from its FIM baseline (file payload).
  EVENT_TYPE_FIM_CHANGE = 14;
  // Policy module events (policy payload).
  EVENT_TYPE_WEB_REPUTATION = 15;
  EVENT_TYPE_INTRUSION = 16;
  EVENT_TYPE_DEVICE_CONTROL = 17;
  EVENT_TYPE_APP_CONTROL = 18;
}

// Priority decides what survives when an agent's local queue is under
// pressure: the lowest priority is dropped first, critical events last.
enum Priority {
  PRIORITY_UNSPECIFIED = 0;
  PRIORITY_LOW = 1;
  PRIORITY_NORMAL = 2;
  PRIORITY_HIGH = 3;
  PRIORITY_CRITICAL = 4;
}

// Event is the canonical SecurityEvent. Linux and Windows agents produce the
// same logical model; see docs/architecture.md. Fields 4-9 and 20 form the
// schema_version 1 envelope; agents built before it leave them empty.
message Event {
  string id = 1;
  int64 timestamp_unix_nano = 2;
  EventType type = 3;
  uint32 schema_version = 4;
  string agent_id = 5;
  // Set by the server from the enrollment record. The certificate only
  // authenticates the host; values sent by the agent are ignored.
  string tenant_id = 6;
  string endpoint_id = 7;
  Priority priority = 8;
  // The process that caused the event (for process events, the process itself).
  ProcessContext process_context = 9;
  map<string, string> metadata = 20;
  oneof payload {
    ProcessEvent process = 10;
    FileEvent file = 11;
    NetworkEvent network = 12;
    YaraMatch yara = 13;
    TamperEvent tamper = 14;
    PolicyEvent policy = 15;
  }
}

// ProcessContext identifies a process by process_guid, which stays unique
// when the kernel reuses a PID. On Linux it is derived from the boot ID, the
// PID and the process start time.
message ProcessContext {
  string process_guid = 1;
  uint32 pid = 2;
  uint32 ppid = 3;
  string executable = 4;
  string command_line = 5;
  string user = 6;
  uint32 uid = 7;
  string sha256 = 8;
  int64 start_time_unix_nano = 9;
  string parent_process_guid = 10;
  string parent_executable = 11;
  string parent_command_line = 12;
  string parent_user = 13;
  string parent_sha256 = 14;
}

message ProcessEvent {
  uint32 pid = 1;
  uint32 ppid = 2;
  uint32 uid = 3;
  uint32 gid = 4;
  string user = 5;
  string exe = 6;
  repeated string args = 7;
  string cwd = 8;
  string sha256 = 9;
  string parent_exe = 10;
  int32 exit_code = 11;
}

message FileEvent {
  string path = 1;
  string old_path = 2;
  uint64 size = 3;
  uint32 mode = 4;
  uint32 uid = 5;
  string sha256 = 6;
  // The process that made the change. Only the eBPF collector knows it;
  // inotify events leave these empty.
  uint32 pid = 7;
  uint32 ppid = 8;
  string exe = 9;
  string user = 10;
  // FIM only: added, removed, content, permissions or owner (comma separated).
  string change = 11;
  // FIM only: the baseline hash.
  string old_sha256 = 12;
}

message NetworkEvent {
  string protocol = 1;
  string local_addr = 2;
  uint32 local_port = 3;
  string remote_addr = 4;
  uint32 remote_port = 5;
  uint32 pid = 6;
  string exe = 7;
  uint32 uid = 8;
}

message YaraMatch {
  string path = 1;
  string sha256 = 2;
  repeated string rules = 3;
  // The process whose binary matched, when the scan came from an exec.
  uint32 pid = 4;
  uint64 size = 5;
  // "quarantined" when anti-malware moved the file away.
  string action = 6;
}

// Something tried to stop, change or remove the agent, or protection changed.
message TamperEvent {
  // e.g. signal_ignored, unclean_restart, protection_removed, maintenance.
  string action = 1;
  string detail = 2;
  uint32 pid = 3;
  string exe = 4;
}

// What a policy module saw or did.
message PolicyEvent {
  // blocked, detected, banned or connected.
  string action = 1;
  string detail = 2;
  string remote_addr = 3;
  uint32 pid = 4;
  string exe = 5;
  string sha256 = 6;
  string user = 7;
}

message ElevationRequest {
  // The local account, identified by the agent from the socket peer.
  string user = 1;
  uint32 uid = 2;
  string reason = 3;
  uint64 duration_seconds = 4;
}

message GetElevationRequest {
  string id = 1;
}

message ElevationStatus {
  string id = 1;
  // pending, approved, active, denied, expired, revoked or failed.
  string status = 2;
  string note = 3;
  int64 expires_unix = 4;
}

message PrivilegedAccount {
  string name = 1;
  uint32 uid = 2;
  string shell = 3;
  string home = 4;
  // Why the account is privileged, e.g. uid0, group:sudo, sudoers, jit.
  repeated string sources = 5;
  repeated string groups = 6;
  // A sudoers rule lets it run commands without a password.
  bool nopasswd = 7;
  // set, locked, empty or none.
  string password = 8;
  int64 password_changed_unix = 9;
  uint32 ssh_keys = 10;
  int64 last_login_unix = 11;
  string last_login_from = 12;
}

message PrivilegedAccounts {
  repeated PrivilegedAccount accounts = 1;
  // Accounts in /etc/passwd with a login shell.
  uint32 interactive_accounts = 2;
}

message PrivilegedAccountsAck {}

message SessionRecording {
  // Unique per host: the sudo I/O log directory.
  string session_id = 1;
  string user = 2;
  string runas_user = 3;
  string tty = 4;
  string cwd = 5;
  string command = 6;
  int64 start_unix = 7;
  uint64 duration_ms = 8;
  // Terminal output (ttyout or stdout), capped by the agent.
  bytes output = 9;
  bool truncated = 10;
  // The just-in-time grant active when the session ran, if any.
  string request_id = 11;
}

message SessionRecordingAck {}

// Console to agent, on the live stream.
message LiveDown {
  oneof msg {
    ShellOpen shell_open = 1;
    ShellData shell_input = 2;
    ShellResize shell_resize = 3;
    ShellClose shell_close = 4;
    ActivityRequest activity = 5;
  }
}

// Agent to console, on the live stream.
message LiveUp {
  oneof msg {
    ShellData shell_output = 1;
    ShellExit shell_exit = 2;
    Activity activity = 3;
  }
}

// Start a login shell for user on a new pseudo-terminal.
message ShellOpen {
  string session_id = 1;
  string user = 2;
  uint32 cols = 3;
  uint32 rows = 4;
}

message ShellData {
  string session_id = 1;
  bytes data = 2;
}

message ShellResize {
  string session_id = 1;
  uint32 cols = 2;
  uint32 rows = 3;
}

message ShellClose {
  string session_id = 1;
}

message ShellExit {
  string session_id = 1;
  int32 exit_code = 2;
  // Why the shell could not start or ended abnormally.
  string error = 3;
}

message ActivityRequest {
  string request_id = 1;
}

// What is happening on the host right now.
message Activity {
  string request_id = 1;
  repeated TerminalSession terminals = 2;
  // The busiest processes, by CPU since the previous request.
  repeated LiveProcess top = 3;
  double load1 = 4;
  uint64 mem_total_bytes = 5;
  uint64 mem_available_bytes = 6;
  uint64 uptime_seconds = 7;
}

// A terminal someone is logged in on (SSH, console or a remote shell from
// the XDR console), and what runs in it.
message TerminalSession {
  string tty = 1;
  string user = 2;
  // Client address for SSH sessions.
  string from = 3;
  int64 login_unix = 4;
  // Seconds since the terminal last had input.
  uint64 idle_seconds = 5;
  // The command in the foreground, i.e. what the user is running now.
  string current = 6;
  repeated LiveProcess processes = 7;
  // A remote shell opened from the XDR console.
  bool console = 8;
}

message LiveProcess {
  uint32 pid = 1;
  uint32 ppid = 2;
  string user = 3;
  string tty = 4;
  string command = 5;
  double cpu_percent = 6;
  uint64 rss_bytes = 7;
  int64 start_unix = 8;
}
