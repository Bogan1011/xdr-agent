id: lnx-reverse-shell-dev-tcp
title: Reverse shell via /dev/tcp
description: A shell redirects its input/output to a TCP socket using bash's /dev/tcp feature.
level: critical
tags: [attack.execution, attack.t1059.004, attack.command_and_control]
logsource: {product: linux, category: process_creation}
detection:
  selection:
    cmdline|contains:
      - /dev/tcp/
      - /dev/udp/
  condition: selection
